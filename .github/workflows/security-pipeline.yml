name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # needed to upload SARIF to the Security tab
  # id-token is granted per-job on log-integrity-agent (OIDC → AWS)

jobs:
  semgrep-scan:
    name: semgrep-scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep   # always current Semgrep CLI, avoids the deprecated wrapper action
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep ci --config p/owasp-top-ten --config p/security-audit
        # semgrep ci exits non-zero on findings above the ruleset's blocking threshold,
        # which correctly fails this job — no continue-on-error needed

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Gitleaks can scan past commits, not just HEAD

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Custom rules (incl. LLM API key patterns) go in .gitleaks.toml at repo root

  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secure-cicd-demo:${{ github.sha }} ./app

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-cicd-demo:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'   # fail build on high/critical findings

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # Disposable Fargate agent: OIDC → RunTask → wait → read audit object → PR comment.
  # The agent never talks to GitHub; CI posts the comment with GITHUB_TOKEN.
  log-integrity-agent:
    name: log-integrity-agent
    runs-on: ubuntu-latest
    needs:
      - semgrep-scan
      - dependency-scan
      - secrets-scan
      - container-scan
    # Run even if a scan failed — the agent is meant to review pipeline outcomes.
    if: always()
    permissions:
      id-token: write       # GitHub OIDC → AWS
      contents: read
      pull-requests: write  # post findings comment on PRs
    env:
      AUDIT_OBJECT_KEY: results/${{ github.run_id }}/${{ github.sha }}.md
    steps:
      # Temporary: print OIDC claims only (not the raw JWT) to fix trust-policy sub mismatch.
      - name: Debug OIDC claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub, aud, repository, repository_owner, iss, job_workflow_ref}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900   # 15-minute session (role ceiling is 3600)
          audience: sts.amazonaws.com

      - name: Run ephemeral ECS Fargate agent task
        id: run_task
        run: |
          set -euo pipefail
          OVERRIDES=$(jq -nc \
            --arg bucket "${{ vars.AUDIT_BUCKET_NAME }}" \
            --arg key "${AUDIT_OBJECT_KEY}" \
            --arg run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg repo "${{ github.repository }}" \
            '{containerOverrides:[{name:"agent",environment:[
              {name:"AUDIT_BUCKET",value:$bucket},
              {name:"AUDIT_OBJECT_KEY",value:$key},
              {name:"GITHUB_RUN_ID",value:$run_id},
              {name:"GITHUB_SHA",value:$sha},
              {name:"GITHUB_REPOSITORY",value:$repo}
            ]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "${{ vars.ECS_TASK_DEFINITION }}" \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNET_ID }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "task_arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"
          echo "Started task: ${TASK_ARN}"

      - name: Wait for agent task to stop
        run: |
          set -euo pipefail
          aws ecs wait tasks-stopped \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --tasks "${{ steps.run_task.outputs.task_arn }}"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --tasks "${{ steps.run_task.outputs.task_arn }}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          echo "Container exit code: ${EXIT_CODE}"

      - name: Fetch audit findings from S3
        id: audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent
          if aws s3api head-object \
            --bucket "${{ vars.AUDIT_BUCKET_NAME }}" \
            --key "${AUDIT_OBJECT_KEY}" >/dev/null 2>&1; then
            aws s3 cp "s3://${{ vars.AUDIT_BUCKET_NAME }}/${AUDIT_OBJECT_KEY}" /tmp/agent/findings.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            cat > /tmp/agent/findings.md <<EOF
          No audit object was written at \`s3://${{ vars.AUDIT_BUCKET_NAME }}/${AUDIT_OBJECT_KEY}\`.

          This is expected until the real agent image writes findings there.
          Task: \`${{ steps.run_task.outputs.task_arn }}\`
          EOF
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment findings on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/agent/findings.md', 'utf8');
            const found = '${{ steps.audit.outputs.found }}' === 'true';
            const header = found
              ? '## Log integrity agent findings'
              : '## Log integrity agent (no audit object yet)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${header}\n\n${body}`,
            });
