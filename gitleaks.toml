title = "Gitleaks Custom Config - secure-cicd-pipeline"

[extend]
# Start from Gitleaks' default ruleset, then extend it below
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic (Claude) API Key"
regex = '''sk-ant-[a-zA-Z0-9_-]{20,}'''
tags = ["ai", "llm", "secret"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-(proj-)?[a-zA-Z0-9_-]{20,}'''
tags = ["ai", "llm", "secret"]

[[rules]]
id = "huggingface-token"
description = "Hugging Face Access Token"
regex = '''hf_[a-zA-Z0-9]{20,}'''
tags = ["ai", "llm", "secret"]

# Allowlist: add known dummy/test keys here so they don't trigger false positives
[allowlist]
description = "Ignore known test/dummy values"
regexes = [
  '''sk-ant-EXAMPLE.*''',
  '''sk-EXAMPLE.*'''
]
